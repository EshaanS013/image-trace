[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image-trace"
version = "0.1.0"
description = "Local-first image metadata and integrity investigation service"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "exifread==3.5.1",
  "fastapi==0.116.1",
  "jinja2==3.1.6",
  "pillow==11.3.0",
  "piexif==1.1.3",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "reportlab==4.4.3",
  "sqlalchemy==2.0.43",
  "tzdata==2025.2",
  "uvicorn[standard]==0.35.0",
  "weasyprint==66.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-pillow==10.2.0.20240822",
]

[tool.hatch.build.targets.wheel]
packages = ["image_trace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
